[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfitz"
version = "0.1.0"
description = "A fast, lightweight Python library for PDF document parsing, spatial text extraction, and raster rendering, powered by Google PDFium."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Jagadeesh Murugesan", email = "jagadeeshsanjay88705@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
keywords = [
    "pdf",
    "pdfium",
    "pypdfium2",
    "spatial-extraction",
    "bounding-box",
    "pdf-parser",
    "raster-rendering",
    "checkbox-detection",
    "mit-license",
]
dependencies = [
    "pypdfium2>=4.30.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/jagadeesh88705/openfitz"
Repository = "https://github.com/jagadeesh88705/openfitz"
Issues = "https://github.com/jagadeesh88705/openfitz/issues"

[tool.hatch.build.targets.wheel]
packages = ["fitz", "openfitz"]
